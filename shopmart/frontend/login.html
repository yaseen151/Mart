<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopMart | Login & Signup</title>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Poppins:wght@300;400;500;600&display=swap');

        /* --- THEME VARIABLES --- */
        :root {
            --primary-dark: #023E36;
            --accent-orange: #F49D37;
            --bg-cream: #F8F1E7;
            --white: #FFFFFF;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Poppins", sans-serif; text-decoration: none; }

        body {
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
            background: var(--bg-cream);
        }

        .container {
            position: relative; width: 850px; height: 550px; background: var(--white);
            border-radius: 30px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1); overflow: hidden;
        }

        .container h1 { font-family: 'Playfair Display', serif; font-size: 36px; color: var(--primary-dark); margin-bottom: 10px; }

        form { width: 100%; }

        .form-box {
            position: absolute; right: 0; width: 50%; height: 100%;
            padding: 40px; background: var(--white);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; transition: 0.6s ease-in-out 1.2s, visibility 0s 1s; z-index: 1;
        }

        .container.active .form-box { right: 50%; }
        .form-box.register { visibility: hidden; }
        .container.active .form-box.register { visibility: visible; }

        .input-box { position: relative; margin: 20px 0; width: 100%; }
        
        .input-box input {
            width: 100%; padding: 13px 50px 13px 20px;
            background: #eee; border-radius: 8px; border: none;
            font-size: 16px; outline: none; transition: all 0.3s ease;
        }
        
        .input-box i { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); font-size: 20px; color: #666; }

        /* --- TORCH EFFECT --- */
        .torch-btn {
            position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
            cursor: pointer; font-size: 1.4rem; transition: all 0.3s ease;
            opacity: 0.6; filter: grayscale(100%); z-index: 10;
        }
        .torch-active .torch-btn {
            opacity: 1; filter: grayscale(0%);
            transform: translateY(-50%) rotate(-20deg) scale(1.2);
            text-shadow: 0 0 15px #F49D37;
        }
        .torch-active input {
            background-color: #fff !important; color: #000 !important;
            box-shadow: 0 0 20px rgba(244, 157, 55, 0.5), inset 0 0 10px rgba(244, 157, 55, 0.1) !important;
            border: 1px solid #F49D37;
        }

        /* --- FORGOT PASSWORD LINK --- */
        .forgot-link {
            margin: -10px 0 15px;
            text-align: right;
            width: 100%;
        }
        .forgot-link a {
            font-size: 0.9rem;
            color: #666;
            font-weight: 500;
            transition: 0.3s;
        }
        .forgot-link a:hover {
            color: var(--accent-orange);
            text-decoration: underline;
        }

        .btn {
            width: 100%; height: 48px; background: var(--accent-orange);
            color: #fff; border: none; border-radius: 8px;
            cursor: pointer; font-size: 16px; font-weight: 600; margin-top: 5px;
            transition: 0.3s;
        }
        .btn:hover { background: #e08e2e; transform: translateY(-2px); }

        .toggle-box { position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: 100; pointer-events: none; }
        .toggle-box::before {
            content: ""; position: absolute; left: -250%; width: 300%; height: 100%;
            background: var(--primary-dark); border-radius: 150px; z-index: 2; transition: 1.8s ease-in-out;
        }
        .container.active .toggle-box::before { left: 50%; }

        .toggle-panel {
            position: absolute; width: 50%; height: 100%; color: #fff;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 2; transition: 0.6s ease-in-out; pointer-events: auto;
            padding: 0 30px;
            text-align: center;
        }
        .toggle-panel h1 { color: white; line-height: 1.2; margin-bottom: 10px; }
        .toggle-panel p { margin-bottom: 20px; font-size: 0.9rem; }
        .toggle-left { left: 0; transition-delay: 1.2s; }
        .container.active .toggle-left { left: -50%; transition-delay: 0.6s; }
        .toggle-right { right: -50%; transition-delay: 0.6s; }
        .container.active .toggle-right { right: 0; transition-delay: 1.2s; }
        .toggle-panel .btn { width: 160px; background: transparent; border: 2px solid #fff; }
        .toggle-panel .btn:hover { background: white; color: var(--primary-dark); }

        @media screen and (max-width: 650px) {
            .container { height: 100vh; width: 100%; border-radius: 0; }
            .form-box { width: 100%; height: 70%; bottom: 0; }
            .container.active .form-box { right: 0; bottom: 30%; }
            .toggle-box::before { left: 0; top: -270%; width: 100%; height: 300%; }
            .container.active .toggle-box::before { top: 70%; }
            .toggle-panel { width: 100%; height: 30%; padding: 0 20px; }
            .toggle-left { top: 0; }
            .toggle-right { bottom: -30%; }
            .container.active .toggle-right { bottom: 0; }
        }
    </style>
</head>

<body>
    <div class="container">
        
        <div class="form-box login">
            <form id="login-form">
                <h1>Welcome Back</h1>
                <p style="font-size:0.9rem; margin-bottom:20px; color:#666;">Enter your details to login</p>

                <div class="input-box">
                    <input type="email" id="login-email" placeholder="Email Address" required />
                    <i class="bx bxs-envelope"></i>
                </div>

                <div class="input-box" id="login-pass-box">
                    <input type="password" id="login-password" placeholder="Password" required style="padding-right: 45px;" />
                    <span class="torch-btn" onclick="toggleTorch('login-password', 'login-pass-box', this)">🔦</span>
                </div>

                <div class="forgot-link">
                    <a href="#" onclick="handleForgotPass()">Forgot Password?</a>
                </div>

                <button type="submit" class="btn">Login</button>
            </form>
        </div>

        <div class="form-box register">
            <form id="register-form">
                <h1>Create Account</h1>
                <p style="font-size:0.9rem; margin-bottom:20px; color:#666;">Join our vintage community</p>

                <div class="input-box">
                    <input type="text" id="reg-name" placeholder="Full Name" required />
                    <i class="bx bxs-user"></i>
                </div>

                <div class="input-box">
                    <input type="email" id="reg-email" placeholder="Email" required />
                    <i class="bx bxs-envelope"></i>
                </div>

                <div class="input-box">
                    <input type="password" id="reg-password" placeholder="Password" required />
                    <i class="bx bxs-lock-alt"></i>
                </div>

                <button type="submit" class="btn">Register</button>
            </form>
        </div>

        <div class="toggle-box">
            <div class="toggle-panel toggle-left">
                <h1>Hello, Friend!</h1>
                <p>Register with your personal details to use all of site features</p>
                <button class="btn register-btn">Register</button>
            </div>
            <div class="toggle-panel toggle-right">
                <h1>Welcome Back!</h1>
                <p>Enter your personal details to use all of site features</p>
                <button class="btn login-btn">Login</button>
            </div>
        </div>
    </div>

    <script>
        const container = document.querySelector(".container");
        const registerBtn = document.querySelector(".register-btn");
        const loginBtn = document.querySelector(".login-btn");

        registerBtn.addEventListener("click", () => { container.classList.add("active"); });
        loginBtn.addEventListener("click", () => { container.classList.remove("active"); });

        // Torch Logic
        function toggleTorch(inputId, boxId, btn) {
            const input = document.getElementById(inputId);
            const box = document.getElementById(boxId);
            if (input.type === "password") {
                input.type = "text"; box.classList.add("torch-active");
            } else {
                input.type = "password"; box.classList.remove("torch-active");
            }
        }

        // Forgot Password Logic (Placeholder)
        function handleForgotPass() {
            const email = prompt("Please enter your registered email address:");
            if(email) {
                // In a real app, we would send this to the backend to trigger an email
                alert("If this email exists, a reset link has been sent! (Logic pending integration)");
            }
        }

        // API Helper
        const API_URL = 'http://localhost:5000/api';
        async function apiFetch(endpoint, options = {}) {
            const headers = { 'Content-Type': 'application/json' };
            const config = { ...options, headers };
            return await fetch(`${API_URL}${endpoint}`, config);
        }

        // Login Logic
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                const res = await apiFetch('/auth/login', { method: 'POST', body: JSON.stringify({ email, password }) });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = 'index.html';
                } else { alert(data.message || "Login failed"); }
            } catch (err) { alert("Network Error"); }
        });

        // Signup Logic
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;

            try {
                const res = await apiFetch('/auth/signup', { method: 'POST', body: JSON.stringify({ name, email, password }) });
                const data = await res.json();
                if (res.ok) {
                    alert('Account created! Please Login.');
                    container.classList.remove("active");
                } else { alert(data.message || "Signup failed"); }
            } catch (err) { alert("Network Error"); }
        });
        // --- FORGOT PASSWORD LOGIC (CONNECTED) ---
        async function handleForgotPass() {
            const email = prompt("Please enter your registered email address:");
            
            if (email) {
                // Show loading state (optional but good UX)
                const originalText = document.querySelector('.forgot-link a').innerText;
                document.querySelector('.forgot-link a').innerText = "Sending...";

                try {
                    const res = await apiFetch('/auth/forgot-password', {
                        method: 'POST',
                        body: JSON.stringify({ email: email })
                    });

                    const data = await res.json();

                    if (res.ok) {
                        alert("✅ Success! " + data.message);
                    } else {
                        alert("❌ Error: " + data.message);
                    }
                } catch (err) {
                    alert("Network error. Check server.");
                } finally {
                    document.querySelector('.forgot-link a').innerText = "Forgot Password?";
                }
            }
        }
    </script>
    
</body>
</html>
